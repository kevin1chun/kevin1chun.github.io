<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kevin Chun</title>
    <meta name="description" content="Software engineer building at the intersection of AI and finance.">
    <meta name="theme-color" content="#0a0a0b">
    <meta property="og:title" content="Kevin Chun">
    <meta property="og:description" content="Software engineer building at the intersection of AI and finance.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kevinchun.com">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='60' height='85' x='20' y='8' rx='4' fill='%23c8a652'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0b;
            --fg: #a0a0a0;
            --fg-bright: #d4d4d4;
            --accent: #c8a652;
            --accent-hover: #dbb85e;
        }

        body {
            font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            background: var(--bg);
            color: var(--fg);
            font-size: 15px;
            font-weight: 300;
            line-height: 1.75;
            padding: clamp(2.5rem, 8vw, 8rem);
            padding-top: clamp(4rem, 18vh, 14rem);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        main {
            max-width: 540px;
        }

        h1 {
            font-size: clamp(1.4rem, 3.5vw, 1.75rem);
            font-weight: 400;
            color: var(--fg-bright);
            letter-spacing: -0.01em;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeUp 0.6s ease forwards;
        }

        .cursor {
            display: inline-block;
            width: 0.55em;
            height: 1.15em;
            background: var(--accent);
            margin-left: 0.12em;
            vertical-align: text-bottom;
            animation: blink 1.1s step-end infinite;
        }

        p {
            margin-bottom: 1.75rem;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.1s forwards;
        }

        .projects {
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.2s forwards;
        }

        .projects p {
            opacity: 1;
            animation: none;
            margin-bottom: 0;
        }

        a {
            color: var(--accent);
            text-decoration: none;
            position: relative;
        }

        a::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--accent-hover);
            transition: width 0.3s ease;
        }

        a:hover {
            color: var(--accent-hover);
        }

        a:hover::after {
            width: 100%;
        }

        nav {
            display: flex;
            gap: 2rem;
            font-weight: 400;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.3s forwards;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                font-size: 14px;
                padding: 2rem 1.5rem;
                padding-top: 3.5rem;
            }

            nav {
                gap: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>kevin chun<span class="cursor"></span></h1>

        <p>software engineer building at the intersection of ai and finance.</p>

        <section class="projects">
            <p>co-founder / ceo of <a href="https://taji.is">taji</a> — personalized investment intelligence for ai agents.</p>
            <p><a href="https://github.com/kevin1chun/robinhood-for-agents">robinhood-for-agents</a> — ai-native tooling for robinhood integration.</p>
        </section>

        <nav>
            <a href="https://github.com/kevin1chun">github</a>
            <a href="https://www.linkedin.com/in/kevin1chun/">linkedin</a>
        </nav>
    </main>
</body>
</html>
